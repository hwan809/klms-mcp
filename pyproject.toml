[project]
name = "klms-mcp"
version = "0.1.0"
description = "Read-only KAIST KLMS tools for Codex (MCP)"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.1,<3",
    "playwright>=1.40",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
]

[project.scripts]
klms-mcp = "klms_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/klms_mcp"]
